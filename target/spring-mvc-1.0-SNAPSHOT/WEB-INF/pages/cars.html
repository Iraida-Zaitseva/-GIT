<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cars List</title>
</head>
<body>
<h1>List of Cars</h1>
<table border="1" th:if="${cars != null and not #lists.isEmpty(cars)}">
    <thead>
    <tr>
        <th>Brand</th>
        <th>Model</th>
        <th>Year</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="car : ${cars}">
        <td th:text="${car.brand}">No brand</td>
        <td th:text="${car.model}">No model</td>
        <td th:text="${car.year}">No year</td>
    </tr>
    </tbody>
</table>
<p th:if="${cars == null or #lists.isEmpty(cars)}">No cars available. Try adding some data in CarService.</p>
</body>
</html>
